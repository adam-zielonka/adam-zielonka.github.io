<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101411" />
    <title>Adam Zielonka — apps, tools and experiments</title>
    <meta
      name="description"
      content="Personal projects by Adam Zielonka. Explore web apps, tools and games, try the demos and read the code."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta
      property="og:title"
      content="Adam Zielonka — curiosity written in code"
    />
    <meta
      property="og:description"
      content="Apps, tools and experiments. A portfolio you can explore like a terminal."
    />
    <meta property="og:url" content="https://adam-zielonka.github.io/" />
    <link rel="canonical" href="https://adam-zielonka.github.io/" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="stylesheet" href="/src/styles/index.scss" />
  </head>
  <body>
    <noscript
      ><style>
        .TerminalControls,
        .QuickCommands button,
        .TerminalHints,
        .UnderTerminal {
          display: none;
        }
      </style></noscript
    >
    <a class="SkipLink" href="#terminal">Skip to terminal</a>
    <div class="SiteShell">
      <main>
        <section
          class="TerminalWindow"
          id="terminal"
          aria-label="Interactive portfolio"
          tabindex="-1"
        >
          <header class="TerminalBar">
            <div class="WindowDots" aria-hidden="true">
              <i></i><i></i><i></i>
            </div>
            <span class="TerminalTitle">adam@portfolio <span>~</span></span>
            <div class="TerminalControls">
              <button type="button" data-skip-animation hidden>
                Skip animation</button
              ><button type="button" data-toggle-motion aria-pressed="true">
                Animations: on
              </button>
            </div>
          </header>
          <nav class="QuickCommands" aria-label="Command shortcuts">
            <span>try</span><a href="#home" data-command="whoami">whoami</a
            ><a href="#projects" data-command="projects">projects</a
            ><a href="#about" data-command="about">about</a
            ><a href="#contact" data-command="contact">contact</a
            ><button type="button" data-command="help">
              help <span aria-hidden="true">?</span>
            </button>
          </nav>
          <div id="fallback"><portfolio-fallback /></div>
          <div id="root"></div>
          <footer class="TerminalHints" id="terminal-hint">
            <span
              ><kbd>Enter</kbd> run
              <span class="HintDesktop"
                >· <kbd>↑</kbd> <kbd>↓</kbd> history ·
                <kbd>Tab</kbd> complete</span
              ></span
            ><span class="LocalSession"
              ><i aria-hidden="true"></i> local session</span
            >
          </footer>
        </section>
        <p class="UnderTerminal">
          <span class="SmallPrompt" aria-hidden="true">&gt;_</span> Click
          around. Type a command. Make yourself at home.
        </p>
        <p
          id="command-status"
          class="VisuallyHidden"
          role="status"
          aria-live="polite"
          aria-atomic="true"
        ></p>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101411" />
    <title>Adam Zielonka — apps, tools and experiments</title>
    <meta
      name="description"
      content="Personal projects by Adam Zielonka. Explore web apps, tools and games, try the demos and read the code."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta
      property="og:title"
      content="Adam Zielonka — curiosity written in code"
    />
    <meta
      property="og:description"
      content="Apps, tools and experiments. A portfolio you can explore like a terminal."
    />
    <meta property="og:url" content="https://adam-zielonka.github.io/" />
    <link rel="canonical" href="https://adam-zielonka.github.io/" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="stylesheet" href="/src/styles/index.scss" />
  </head>
  <body>
    <noscript
      ><style>
        .TerminalControls,
        .QuickCommands button,
        .TerminalHints {
          display: none;
        }
      </style></noscript
    >
    <a class="SkipLink" href="#terminal">Skip to terminal</a>
    <div class="SiteShell">
      <main>
        <section
          class="TerminalWindow"
          id="terminal"
          aria-label="Interactive portfolio"
          tabindex="-1"
        >
          <div class="CRTScreen">
            <header class="TerminalBar">
              <span class="TerminalTitle">adam@portfolio <span>~/</span></span>
              <div class="TerminalControls">
                <button type="button" data-skip-animation hidden>
                  Skip animation</button
                ><button type="button" data-toggle-motion aria-pressed="true">
                  Animations: on
                </button>
              </div>
            </header>
            <nav class="QuickCommands" aria-label="Command shortcuts">
              <span>try</span><a href="#home" data-command="whoami">whoami</a
              ><a href="#projects" data-command="projects">projects</a
              ><a href="#about" data-command="about">about</a
              ><a href="#contact" data-command="contact">contact</a
              ><a href="#windows" data-command="windows">windows</a
              ><button type="button" data-command="help">
                help <span aria-hidden="true">?</span>
              </button>
            </nav>
            <div id="fallback"><portfolio-fallback /></div>
            <div id="root"></div>
            <footer class="TerminalHints" id="terminal-hint">
              <span
                ><kbd>Enter</kbd> run
                <span class="HintDesktop"
                  >· <kbd>↑</kbd> <kbd>↓</kbd> history ·
                  <kbd>Tab</kbd> complete</span
                ></span
              ><span class="LocalSession"
                ><i aria-hidden="true"></i> local session</span
              >
            </footer>
          </div>
          <div class="CRTChin">
            <div class="CRTBadge" aria-hidden="true">
              AZ<span>PERSONAL COMPUTER</span>
            </div>
            <div class="CRTVents" aria-hidden="true"></div>
            <div class="CRTHardware" hidden>
              <div class="CRTIndicators" data-disk="idle" aria-hidden="true">
                <div class="CRTIndicator">
                  <i class="CRTLED CRTLED--power"></i><span>PWR</span>
                </div>
                <div class="CRTIndicator">
                  <i class="CRTLED CRTLED--disk"></i><span>HDD</span>
                </div>
              </div>
              <button
                class="CRTPower"
                type="button"
                data-toggle-power
                aria-label="Computer power"
                aria-pressed="true"
                title="Turn off computer"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  aria-hidden="true"
                >
                  <defs>
                    <mask
                      id="power-symbol-wear"
                      maskUnits="userSpaceOnUse"
                      x="0"
                      y="0"
                      width="24"
                      height="24"
                    >
                      <rect width="24" height="24" fill="white" stroke="none" />
                      <path
                        d="M2 8l18-3M4 15l16-2M9 20l9-3"
                        stroke="black"
                        stroke-width="0.8"
                        opacity="0.7"
                      />
                      <path
                        d="M11 3h3M3 12l4-1"
                        stroke="black"
                        stroke-width="1"
                      />
                    </mask>
                  </defs>
                  <path
                    d="M7 5a8 8 0 1 0 10 0M12 2v10"
                    mask="url(#power-symbol-wear)"
                  />
                </svg>
              </button>
            </div>
          </div>
        </section>
        <p
          id="command-status"
          class="VisuallyHidden"
          role="status"
          aria-live="polite"
          aria-atomic="true"
        ></p>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
